ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    # Planar 2D state (x, y, yaw, vx, vy, vyaw). Keeps z/roll/pitch zeroed for 2D Nav2
    # costmaps and avoids unobservable z-drift without an altitude/3D pose sensor.
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true

    # Wheel odometry: linear velocity (vx, vy) and yaw rate (vyaw).
    # Matrix order: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: roll and pitch (absolute, from gravity) and angular velocity, but NOT absolute yaw.
    # MuJoCo's framequat gives the true world yaw; a real rover on Mars has no magnetometer
    # heading (no global magnetic field), so fusing it would hide all heading drift.
    # Linear acceleration is excluded: robot_localization removes Earth gravity (9.80665 m/s^2),
    # not Mars gravity (3.721 m/s^2), and double-integration drifts rapidly.
    imu0: /imu_sensor_broadcaster/imu
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
