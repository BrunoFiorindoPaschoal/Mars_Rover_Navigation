hazard_mapper:
  ros__parameters:
    points_topic: "/points"
    imu_topic: "/imu_sensor_broadcaster/imu"
    hazards_topic: "/hazards"
    grid_topic: "/hazard_grid"
    odom_frame: "odom"
    base_frame: "base_link"

    # 2.5D grid & step-height hazard detection (wheel radius = 0.12 m)
    cell_size: 0.10
    step_threshold: 0.12
    window_radius_m: 0.70
    ground_inlier_threshold: 0.06
    min_ground_cells: 8
    min_plane_eig: 0.015
    max_plane_slope_deg: 35.0
    free_margin_ratio: 0.70

    # Range gating in base_link (rejects rover body + sparse far rings)
    min_range: 0.65
    max_range: 7.50

    # Rolling hazard label memory in odom (never accumulates raw z)
    grid_size_m: 24.0
    memory_ttl: 30.0
    publish_radius_m: 10.0
    hazard_z: 0.30
    free_z: 0.00
